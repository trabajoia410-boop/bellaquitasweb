name: QA migracion Bellaquitas (sin despliegue)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - migracion/fase5-segura-20261114
jobs:
  static-migration-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis de los modulos Cloudflare
        run: |
          for f in cloudflare/{bellaquitas-api-staging,admin-console,auth-routes,email-auth-routes,protected-routes,web-mirror,mirror-write-routes,mirror-data-routes}.js; do
            node --check "$f"
          done
      - name: Verificar bytes, SHA Git y ausencia de R2
        run: node cloudflare/verify-migration.mjs
      - name: Construir exclusivamente los recursos estáticos originales
        run: node cloudflare/build-static-assets.mjs
      - name: Comprobar bloqueo del lanzamiento sin logos originales certificados
        run: node cloudflare/test-original-logos-guard.mjs
      - name: Validar media Worker QA y dry-run de 17 assets sin token ni red
        run: node cloudflare/test-media-qa-deploy.mjs
      - name: Comprobar media Worker online y HTTP Range real cuando haya assets
        run: node cloudflare/test-media-qa-online.mjs
      - name: Examinar formato MP4 original sin recodificar para iPhone y Android
        run: node cloudflare/audit-original-videos.mjs
      - name: Verificar elección de MP4 móvil/escritorio en Safari sin cambios de diseño
        run: node cloudflare/test-ios-video-selection.mjs
      - name: Verificar solicitudes Range 206 para los cinco MP4 originales
        run: node cloudflare/test-mp4-range-proxy.mjs
      - name: Comprobar acceso admin reforzado sin usuarios reales
        run: |
          node cloudflare/test-admin-stepup.mjs
          node cloudflare/test-admin-session-sql.mjs
          node cloudflare/test-admin-email-link.mjs
          node cloudflare/test-admin-console.mjs
      - name: Verificar que el preview online NO permite autenticar ni guarda sesiones
        run: node cloudflare/test-admin-visual-preview.mjs
      - name: Comprobar tarjeta QR y lectura jsQR con imágenes ficticias
        run: node cloudflare/test-qr-roundtrip.mjs
      - name: Verificar fidelidad, visitas, puntos, canjes y auditoría solo en SQLite RAM
        run: node cloudflare/test-loyalty-door-integration.mjs
      - name: Probar Worker QA independiente con DB vacía y roles cerrados
        run: node cloudflare/test-qa-worker-http.mjs
