name: Espejo sin rediseño con nuevo panel — fase 5
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - app.js
      - cloudflare/build-admin-mirror.mjs
      - .github/workflows/qa-admin-mirror.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror-admin-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extraer copia actual del Worker sin desplegar
        run: node cloudflare/staging-source-2026-11-11/extract-modules.mjs
      - name: Integrar SOLO los enlaces de administración, conservar CSS y HTML
        run: node --experimental-default-type=module cloudflare/build-admin-mirror.mjs
      - name: Comprobar sintaxis del sitio público
        run: node --check app.js
      - name: Repetir integración completa con copia visual exacta y nuevo enlace
        run: node --experimental-sqlite --experimental-default-type=module --test cloudflare/test_worker_full_stack.mjs
