name: Recuperación Postgres privada — ensayo con 18 tablas ficticias
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/backup_privado_local.py
      - cloudflare/test_pg_restore_isolated.py
      - cloudflare/restore_privado_aislado.py
      - .github/workflows/qa-postgres-restore.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-postgres-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg_major: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pg_major }}
        env:
          POSTGRES_USER: bellaquitas_fake
          POSTGRES_PASSWORD: only_fictitious_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bellaquitas_fake -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BELLAQUITAS_FAKE_RESTORE: "yes"
      POSTGRES_MAJOR_TEST: ${{ matrix.pg_major }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: bellaquitas_fake
      PGDATABASE: postgres
      PGPASSWORD: only_fictitious_test_password
    steps:
      - uses: actions/checkout@v4
      - name: Usar cliente Postgres oficial del mismo major con Docker
        run: |
          mkdir -p "$RUNNER_TEMP/bellaquitas-pg16-bin"
          for command in psql pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/bellaquitas-pg16-bin/$command" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" \
            --volume /tmp:/tmp \
            --env PGHOST --env PGPORT --env PGUSER --env PGDATABASE --env PGPASSWORD \
            postgres:"$POSTGRES_MAJOR_TEST" "$(basename "$0")" "$@"
          SH
            chmod +x "$RUNNER_TEMP/bellaquitas-pg16-bin/$command"
          done
          echo "$RUNNER_TEMP/bellaquitas-pg16-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bellaquitas-pg16-bin/pg_dump" --version
          "$RUNNER_TEMP/bellaquitas-pg16-bin/pg_restore" --version
      - name: Restaurar respaldo binario en Postgres aislado, conservar identidades y saldos FICTICIOS
        run: python3 cloudflare/test_pg_restore_isolated.py
