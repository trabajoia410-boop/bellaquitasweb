name: Coste cero — bloquear R2 y pagos antes del Worker
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/qa-candidates/free-only-cost-policy.js
      - cloudflare/qa-candidates/bellaquitas-api-staging-admin.js
      - cloudflare/assemble-admin-candidate.mjs
      - cloudflare/test_free_only_cost_guard.mjs
      - cloudflare/qa-candidates/static-media-fallback.js
      - cloudflare/test_static_media_no_r2.mjs
      - cloudflare/test_admin_console.mjs
      - .github/workflows/qa-zero-cost-only.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  block-billable-services:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis de políticas de coste
        run: node --check cloudflare/qa-candidates/free-only-cost-policy.js
      - name: "Comprobar que R2 y email externo no se usan si Free-only está activo"
        run: node --experimental-default-type=module --test cloudflare/test_free_only_cost_guard.mjs
      - name: Recuperar worker y ensamblar candidato sin desplegar ni consultar cuentas
        run: |
          node cloudflare/staging-source-2026-11-11/extract-modules.mjs
          node --experimental-default-type=module cloudflare/assemble-admin-candidate.mjs
      - name: "Verificar los vídeos originales sin lecturas R2 ni desplegar"
        run: node --experimental-default-type=module --test cloudflare/test_static_media_no_r2.mjs
      - name: "Worker completo: D1 ficticia, fotos bloqueadas y cuentas intactas"
        run: node --experimental-sqlite --experimental-default-type=module --test cloudflare/test_admin_console.mjs
