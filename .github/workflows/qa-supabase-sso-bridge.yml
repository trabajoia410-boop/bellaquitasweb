name: Fase 5 — puente SSO Supabase y panel sin segunda contraseña
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/test_supabase_admin_bridge.mjs
      - cloudflare/qa-candidates/supabase-admin-bridge.js
      - cloudflare/qa-candidates/admin-console*
      - cloudflare/assemble-admin-candidate.mjs
      - cloudflare/qa-candidates/bellaquitas-api-staging-admin.js
      - .github/workflows/qa-supabase-sso-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-bridge-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extraer Worker de ensayo y ensamblar SSO sin tocar producción
        run: |
          node cloudflare/staging-source-2026-11-11/extract-modules.mjs
          node --experimental-default-type=module cloudflare/assemble-admin-candidate.mjs
      - name: Verificar sintaxis de módulos Supabase y consola
        run: |
          node --check cloudflare/qa-candidates/supabase-admin-bridge.js
          node --check cloudflare/staging-source-2026-11-11/recovered-src/admin-console-routes.js
          node --check cloudflare/staging-source-2026-11-11/recovered-src/bellaquitas-api-staging.js
      - name: Integración del SSO, permisos, revocación y saldo con Auth/RLS simulados
        run: node --experimental-sqlite --experimental-default-type=module --test cloudflare/test_supabase_admin_bridge.mjs
