name: Bellaquitas - prueba puntual de CPU real (eliminar al terminar)

on:
  push:
    branches:
      - migracion/fase5-segura-20261114
    paths:
      - .github/workflows/bellaquitas-kdf-remote-once-20261119.yml

permissions:
  contents: read

jobs:
  synthetic-kdf-once:
    if: github.repository == 'trabajoia410-boop/bellaquitasweb'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar Worker sintético aislado una sola vez
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --max-time 25 \
            --output /tmp/bq-cpu-response.txt --write-out "%{http_code}" \
            "https://bellaquitas-kdf-synthetic-once-20261119.bellaquitas-fest-410.workers.dev/__qa_cpu/bq-obrjk5slx97hqb3a4yewfmdb6hwbcpxctltnnegy7xm5toc6vse38iqwyjokqmne9xyfq95z9xuw53ugdv")
          echo "HTTP_STATUS=$status"
          head -c 700 /tmp/bq-cpu-response.txt || true
          echo
          if [[ "$status" == "200" ]]; then
            jq -e '.synthetic == true and .vectorMatches == true and .rounds == 6 and .iterationsPerRound == 100000' /tmp/bq-cpu-response.txt >/dev/null
            echo "PROBE_RESULT=VECTOR_PASS_CPU_METRICS_PENDING"
          elif grep -Eiq '1102|exceeded resource limits|exceeded CPU|cpu time limit' /tmp/bq-cpu-response.txt; then
            echo "PROBE_RESULT=CPU_LIMIT_EXCEEDED_WORKERS_FREE"
          else
            echo "::error::El endpoint sintético no dio un resultado que pueda interpretarse. HTTP $status"
            exit 1
          fi
          echo "No hay cuentas, bases de datos, secretos ni escritura D1 en esta prueba."
