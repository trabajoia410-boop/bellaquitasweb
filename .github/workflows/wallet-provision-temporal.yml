name: Bellaquitas - crear clase provisional Google Wallet (una sola vez)
on:
  push:
    branches: [migracion/fase5-segura-20261114]
    paths:
      - .github/workflows/wallet-provision-temporal.yml
permissions:
  contents: read
jobs:
  create-class:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Registrar la clase provisional sin publicar la web
        shell: bash
        run: |
          set -euo pipefail
          output="$(curl --max-time 25 --fail-with-body --silent --show-error --retry 1 \
            'https://cc85a183-bellaquitas-api-preproduccion.bellaquitas-fest-410.workers.dev/_bellaquitas_wallet_setup/ZL7K0orOfMHZHhI7GXn1Vxa3i_J2Xww33Xzw0z31D4c')"
          echo "$output" | jq '{created,exists,id,reviewStatus,stage,http_status,reason}'
          echo "$output" | jq -e '(.created == true) or (.exists == true)' >/dev/null
