name: Bellaquitas Fase 6 - PBKDF2 Workerd local aislado

on:
  push:
    branches:
      - migracion/fase5-segura-20261114
    paths:
      - 'cloudflare/kdf-workerd-local-only.js'
      - 'cloudflare/test-kdf-workerd-local-only.mjs'
      - 'cloudflare/wrangler-kdf-local-only.jsonc'
      - 'cloudflare/email-auth-routes.js'
      - '.github/workflows/bellaquitas-kdf-workerd-local-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bellaquitas-kdf-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kdf-local-no-cloudflare-deployment:
    name: Hash real PBKDF2 en Workerd local, sin cuentas ni dominio
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ""
      CF_API_TOKEN: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar código sintético sin rutas de producción
        run: |
          node --check cloudflare/kdf-workerd-local-only.js
          node --check cloudflare/test-kdf-workerd-local-only.mjs
          node cloudflare/test-no-private-backup-leaks.mjs
          node cloudflare/check-release-gates.mjs --assert-blocked
      - name: Ejercitar la función real de hash en Workerd LOCAL exclusivamente
        shell: bash
        run: |
          set -euo pipefail
          # No se usa ni se configura nunca un API token de Cloudflare.
          npx --yes wrangler@4 dev --local --config cloudflare/wrangler-kdf-local-only.jsonc --ip 127.0.0.1 --port 8797 > /tmp/bellaquitas-kdf-workerd.log 2>&1 &
          KDF_PID=$!
          trap 'kill "$KDF_PID" 2>/dev/null || true' EXIT
          ready="no"
          for i in $(seq 1 75); do
            code=$(curl -sS --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8797/__kdf_synthetic_only || true)
            if [[ "$code" = "405" ]]; then ready="yes"; break; fi
            if ! kill -0 "$KDF_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$ready" != "yes" ]]; then
            echo "::error::Workerd local no arrancó; nunca intentar deploy remoto."
            tail -80 /tmp/bellaquitas-kdf-workerd.log
            exit 1
          fi
          node cloudflare/test-kdf-workerd-local-only.mjs
      - name: Dejar explícito que la CPU de producción sigue sin certificar
        if: always()
        run: |
          echo "## Solo Workerd local" >> "$GITHUB_STEP_SUMMARY"
          echo "La prueba usa un vector sintético y el código REAL de hash. No mide CPU facturable de Cloudflare." >> "$GITHUB_STEP_SUMMARY"
          echo "Se conserva FREE_TIER_CPU_VERIFIED=no, sin Google/Resend/D1/R2 ni cambios DNS." >> "$GITHUB_STEP_SUMMARY"
