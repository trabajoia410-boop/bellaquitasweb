name: Permisos de roles en Worker aislado
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/test_staging_roles.mjs
      - cloudflare/staging-source-2026-11-11/**
      - .github/workflows/qa-staging-roles.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roles-in-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recuperar módulos sin iniciar Worker
        run: node cloudflare/staging-source-2026-11-11/extract-modules.mjs
      - name: Probar permisos de socio, puerta y administrador (solo mocks)
        run: node --experimental-default-type=module --test cloudflare/test_staging_roles.mjs
