name: Auditoría CPU PBKDF2 — Cloudflare Workers Free (sin cuentas)
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/qa-candidates/bench-password-free.mjs
      - .github/workflows/qa-password-cpu-free.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Medir costo orientativo de 100k vs 600k con WebCrypto y secretos ficticios
        run: node cloudflare/qa-candidates/bench-password-free.mjs
