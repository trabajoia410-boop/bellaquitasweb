name: Panel independiente — acceso admin y permisos (sin producción)
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/qa-candidates/admin-console*.js
      - cloudflare/qa-candidates/admin-activation-routes.js
      - cloudflare/migrations/0004-admin-activation.sql
      - cloudflare/qa-candidates/admin-console.html
      - cloudflare/qa-candidates/admin-console.css
      - cloudflare/qa-candidates/bellaquitas-api-staging-admin.js
      - cloudflare/qa-candidates/free-only-cost-policy.js
      - cloudflare/test_admin_console.mjs
      - cloudflare/test_staging_google.mjs
      - cloudflare/migrations/0005-auth-session-method.sql
      - cloudflare/qa-candidates/auth-routes-admin-proof.js
      - app.js
      - .github/workflows/qa-admin-console.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recuperar el Worker original, sin desplegarlo
        run: node cloudflare/staging-source-2026-11-11/extract-modules.mjs
      - name: Integrar SOLO en el runner los módulos candidatos del nuevo panel
        run: |
          cp cloudflare/qa-candidates/admin-console-routes.js cloudflare/staging-source-2026-11-11/recovered-src/admin-console-routes.js
          cp cloudflare/qa-candidates/auth-routes-admin-proof.js cloudflare/staging-source-2026-11-11/recovered-src/auth-routes.js
          cp cloudflare/qa-candidates/admin-activation-routes.js cloudflare/staging-source-2026-11-11/recovered-src/admin-activation-routes.js
          cp cloudflare/qa-candidates/admin-console-ui.js cloudflare/staging-source-2026-11-11/recovered-src/admin-console-ui.js
          cp cloudflare/qa-candidates/free-only-cost-policy.js cloudflare/staging-source-2026-11-11/recovered-src/free-only-cost-policy.js
          cp cloudflare/qa-candidates/static-media-fallback.js cloudflare/staging-source-2026-11-11/recovered-src/static-media-fallback.js
          cp cloudflare/qa-candidates/bellaquitas-api-staging-admin.js cloudflare/staging-source-2026-11-11/recovered-src/bellaquitas-api-staging.js
      - name: Comprobar sintaxis de navegación pública sin cambiar el diseño
        run: node --check app.js
      - name: Verificar marca Google real en callback OAuth con JWT firmado ficticio
        run: REQUIRE_ADMIN_GOOGLE_MARK=1 node --experimental-default-type=module --test cloudflare/test_staging_google.mjs
      - name: Verificar sintaxis y control de acceso admin sobre SQLite ficticia
        run: |
          node --check cloudflare/staging-source-2026-11-11/recovered-src/admin-console-routes.js
          node --check cloudflare/staging-source-2026-11-11/recovered-src/admin-console-ui.js
          node --experimental-sqlite --experimental-default-type=module --test cloudflare/test_admin_console.mjs
