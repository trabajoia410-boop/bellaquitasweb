name: Registro seguro — candidato v2 aislado
on:
  push:
    branches:
      - auditoria/fase5-2026-11-11
    paths:
      - cloudflare/qa-candidates/email-auth-routes-v2.js
      - cloudflare/qa-candidates/bellaquitas-api-staging-v2.js
      - cloudflare/test_staging_registration_timing.mjs
      - .github/workflows/qa-register-timing.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extraer copia original del Worker sin desplegar
        run: node cloudflare/staging-source-2026-11-11/extract-modules.mjs
      - name: Sustituir versiones candidatas SOLO en runner aislado
        run: |
          cp cloudflare/qa-candidates/email-auth-routes-v2.js cloudflare/staging-source-2026-11-11/recovered-src/email-auth-routes.js
          cp cloudflare/qa-candidates/bellaquitas-api-staging-v2.js cloudflare/staging-source-2026-11-11/recovered-src/bellaquitas-api-staging.js
      - name: Comprobar sintaxis de fuentes candidatas
        run: |
          node --check cloudflare/staging-source-2026-11-11/recovered-src/email-auth-routes.js
          node --check cloudflare/staging-source-2026-11-11/recovered-src/bellaquitas-api-staging.js
      - name: Probar registro, captcha, envío diferido y limpieza de tokens falsos
        run: node --experimental-default-type=module --test cloudflare/test_staging_registration_timing.mjs
      - name: Probar retrocompatibilidad login/correo y toda la batería de simulaciones
        run: |
          node --experimental-default-type=module --test cloudflare/test_staging_auth.mjs cloudflare/test_staging_auth_timing.mjs cloudflare/test_staging_google.mjs cloudflare/test_staging_roles.mjs
          python3 -m unittest discover -s cloudflare -p test_sqlite_rules.py -v
          node --experimental-sqlite --experimental-default-type=module --test cloudflare/test_staging_editor.mjs
      - name: Comprobar API y medios del Worker ACTUAL (solo GET y denegaciones)
        run: |
          node cloudflare/test-staging-api.mjs
          node cloudflare/test-staging-media.mjs
